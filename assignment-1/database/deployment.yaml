apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-database
  namespace: dso202-assignment-01
  labels:
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-database
      tier: database
  template:
    metadata:
      labels:
        app: task-database
        tier: database
    spec:
      containers:
        - name: postgres
          image: pulu18/taskdb:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: task-database-pvc