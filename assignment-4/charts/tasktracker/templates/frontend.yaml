# =============================================================================
# File        : charts/tasktracker/templates/frontend.yaml
# Assignment  : DSO202 Assignment 4 (carried over from Assignment 3)
# Descriptor  : Unit IV 4.3.2 (sync waves), 4.3.3 (health checks)
# Purpose     : Frontend tier. Sync-wave "2" places it after the backend (C5);
#               progressDeadlineSeconds shortens how long a failed rollout
#               takes to report Degraded (C6); the readiness probe satisfies
#               C4; the Service stays NodePort with the port number driven by
#               values (C10: 30080 in dev, 30081 in staging).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    tier: frontend
    {{- include "task-tracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: 120
  selector:
    matchLabels: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: ["/bin/sh", "/docker-entrypoint.sh"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.configName" . }}
                  key: BACKEND_URL
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    tier: frontend
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
