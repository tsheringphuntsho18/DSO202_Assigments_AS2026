# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4 (adjusted from Assignment 3 for the chart
#               contract, section 9 Task 1)
# Purpose     : Defaults only (C11). Everything that differs between dev and
#               staging - image tags, replica counts, the frontend NodePort,
#               and existingSecret - is restated in environments/<env>/values.yaml
#               rather than here, so this file never needs an "if env == ..."
#               branch inside a template.
# =============================================================================
nameOverride: ""

# Name of the Secret that Sealed Secrets decrypts into the namespace before
# this chart is synced (chart contract C3). The chart never renders a Secret
# of its own; it only reads the name of one that already exists.
existingSecret: tasktracker-credentials

frontend:
  replicaCount: 1
  image:
    repository: sarojsanyasi/dso202-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
    nodePort: 30080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

backend:
  replicaCount: 1
  image:
    repository: sarojsanyasi/dso202-backend
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
  external:
    port: 5000
    nodePort: 32081
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: 750m, memory: 768Mi}

database:
  image:
    repository: sarojsanyasi/dso202-db
    tag: "1.0"
    pullPolicy: IfNotPresent
  port: 5432
  persistence:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

config:
  dbName: taskdb
  appPort: "8080"
  corsOrigin: http://localhost:30080
  backendUrl: http://localhost:32081
