# =============================================================================
# File        : platform/staging/namespace.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.1 - namespaces; Unit IV 4.3.2 - sync options
# Purpose     : The staging namespace, owned by the platform-staging
#               Application. Identical in shape to platform/dev/namespace.yaml
#               except for the environment name and label.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: dso202-staging
  labels:
    dso202/assignment: "04"
    dso202/environment: staging
    dso202/managed-by: argocd
  annotations:
    # Prune=false: removing this file from Git must never delete the namespace
    # and everything running inside it.
    argocd.argoproj.io/sync-options: Prune=false
