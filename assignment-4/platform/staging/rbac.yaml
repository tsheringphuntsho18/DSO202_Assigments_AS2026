# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.1 - namespace-scoped RBAC, carried over from
#               Assignment 2
# Purpose     : Identical to platform/dev/rbac.yaml for dso202-staging.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-app
  namespace: dso202-staging
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-observer
  namespace: dso202-staging
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-tracker-readonly
  namespace: dso202-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-tracker-readonly-binding
  namespace: dso202-staging
subjects:
  - kind: ServiceAccount
    name: task-tracker-observer
    namespace: dso202-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-tracker-readonly
