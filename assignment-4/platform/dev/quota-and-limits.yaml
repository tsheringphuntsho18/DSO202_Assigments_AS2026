# =============================================================================
# File        : platform/dev/quota-and-limits.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.1/1.5.3 - namespace multi-tenancy (ResourceQuota,
#               LimitRange), carried over from Assignment 2
# Purpose     : Caps aggregate resource usage in dso202-dev and supplies
#               default container requests/limits so that every Pod created
#               here (including the smoke-test hook) satisfies the quota.
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: assignment-quota
  namespace: dso202-dev
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "1536Mi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    pods: "10"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: assignment-limits
  namespace: dso202-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      max:
        cpu: "1"
        memory: "1Gi"
