apiVersion: v1
kind: ResourceQuota
metadata:
  name: assignment-quota
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "1536Mi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    pods: "10"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: assignment-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      max:
        cpu: "1"
        memory: "1Gi"