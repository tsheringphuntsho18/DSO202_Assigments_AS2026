apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - quota.yaml
  - database-pvc.yaml
  - database-deployment.yaml
  - database-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-external-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

configMapGenerator:
  - name: task-tracker-config
    envs:
      - config.env

secretGenerator:
  - name: task-tracker-secret
    envs:
      - secret.env
    type: Opaque

labels:
  - pairs:
      app.kubernetes.io/part-of: task-tracker
    includeSelectors: false

images:
  - name: pulu18/taskbackend
    newTag: 1.0.0
  - name: pulu18/taskfrontend
    digest: sha256:ff91058995e513ad5e936551c191ec9d2b6b23d778a3b51dc049ea9d14879255
  - name: pulu18/taskdb
    newTag: 1.0.0
