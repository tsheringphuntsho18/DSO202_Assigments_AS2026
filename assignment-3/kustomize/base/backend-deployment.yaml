apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend
  labels:
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-backend
      tier: backend
  template:
    metadata:
      labels:
        app: task-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: pulu18/taskbackend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_PASSWORD
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: APP_PORT
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"