# Strategic merge patch: lighter backend for the dev environment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
