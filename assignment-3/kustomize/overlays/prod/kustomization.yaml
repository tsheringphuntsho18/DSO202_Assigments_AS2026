apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dso202-assignment-03-prod

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false

# Different browser-facing URLs (prod is reached with kubectl port-forward)
configMapGenerator:
  - name: task-tracker-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://localhost:8081
      - BACKEND_URL=http://localhost:32082

# JSON patches (RFC 6902)
patches:
  - target:
      kind: Deployment
      name: task-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: task-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Service
      name: task-frontend
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
  - target:
      kind: Service
      name: backend-service-external
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32082
  - target:
      kind: ResourceQuota
      name: assignment-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "3"
      - op: replace
        path: /spec/hard/requests.memory
        value: 3Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "6"
      - op: replace
        path: /spec/hard/limits.memory
        value: 6Gi
      - op: replace
        path: /spec/hard/pods
        value: "15"
