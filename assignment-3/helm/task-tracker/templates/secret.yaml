apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.secretName" . }}
  labels: {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  POSTGRES_USER: {{ .Values.secret.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | quote }}
