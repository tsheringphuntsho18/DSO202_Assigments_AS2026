apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-tracker.configName" . }}
  labels: {{- include "task-tracker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "task-tracker.fullname" . }}-database
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  APP_PORT: {{ .Values.config.appPort | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | quote }}
  POSTGRES_DB: {{ .Values.config.dbName | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
