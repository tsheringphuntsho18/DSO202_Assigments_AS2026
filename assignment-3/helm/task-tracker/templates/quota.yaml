{{- if .Values.quota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "task-tracker.fullname" . }}-quota
  labels: {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  hard: {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "task-tracker.fullname" . }}-limits
  labels: {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest: {{- toYaml .Values.quota.limitRange.defaultRequest | nindent 8 }}
      default: {{- toYaml .Values.quota.limitRange.default | nindent 8 }}
      max: {{- toYaml .Values.quota.limitRange.max | nindent 8 }}
{{- end }}
