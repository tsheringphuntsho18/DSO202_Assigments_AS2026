apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "task-tracker.fullname" . }}-database-pvc
  labels:
    tier: database
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-database
  labels:
    tier: database
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "database") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "database") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.configName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.secretName" . }}
                  key: POSTGRES_PASSWORD
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: {{ include "task-tracker.fullname" . }}-database-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-database
  labels:
    tier: database
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
