nameOverride: ""

frontend:
  replicaCount: 1
  image:
    repository: pulu18/taskfrontend
    tag: "1.0.0"
    digest: "sha256:ff91058995e513ad5e936551c191ec9d2b6b23d778a3b51dc049ea9d14879255"
    pullPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: worker-node-2
  containerPort: 8080
  service:
    port: 8080
    nodePort: 30080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

backend:
  replicaCount: 1
  image:
    repository: pulu18/taskbackend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
  external:
    port: 5000
    nodePort: 32081
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: 750m, memory: 768Mi}

database:
  image:
    repository: pulu18/taskdb
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 5432
  persistence:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

config:
  dbName: taskdb
  appPort: "8080"
  corsOrigin: http://localhost:30080
  backendUrl: http://localhost:32081

secret:
  dbUser: dbuser
  dbPassword: dbpassword

quota:
  enabled: true
  hard:
    requests.cpu: "1500m"
    requests.memory: "1536Mi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    pods: "10"
    persistentvolumeclaims: "2"
  limitRange:
    defaultRequest: {cpu: 100m, memory: 128Mi}
    default: {cpu: 500m, memory: 512Mi}
    max: {cpu: "1", memory: 1Gi}
