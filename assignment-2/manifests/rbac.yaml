apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-app
  namespace: dso202-assignment-01
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-observer
  namespace: dso202-assignment-01
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-tracker-readonly
  namespace: dso202-assignment-01
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-tracker-readonly-binding
  namespace: dso202-assignment-01
subjects:
  - kind: ServiceAccount
    name: task-tracker-observer
    namespace: dso202-assignment-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-tracker-readonly
